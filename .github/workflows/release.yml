name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Write signing credentials
        run: |
          cat >> local.properties <<EOF
          HOOKTRANS_STORE_PASSWORD=${{ secrets.HOOKTRANS_STORE_PASSWORD }}
          HOOKTRANS_KEY_ALIAS=${{ secrets.HOOKTRANS_KEY_ALIAS }}
          HOOKTRANS_KEY_PASSWORD=${{ secrets.HOOKTRANS_KEY_PASSWORD }}
          EOF

      - name: Decode keystore
        run: echo "${{ secrets.HOOKTRANS_KEYSTORE }}" | base64 -d > keystore/hooktrans.jks

      - name: Build release APK
        run: ./gradlew :app:assembleRelease :testapp:assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} release-apks/ \;
          ls -lh release-apks/

      - name: Upload testapp (development harness, not shipped)
        uses: actions/upload-artifact@v4
        with:
          name: testapp
          path: testapp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: release-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-alpha') || contains(steps.tag.outputs.tag, '-beta') || contains(steps.tag.outputs.tag, '-rc') }}
